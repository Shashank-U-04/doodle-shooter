# Pull-request checks. Package managers, as the repository uses them:
#   - frontend (repo root): Bun, from bun.lock
#   - match server (server/): npm, from server/package-lock.json (Render runs `npm ci`)
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Initial-load bundle size
        run: node scripts/measure-bundle.mjs dist >> "$GITHUB_STEP_SUMMARY"

  server:
    name: Match server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22: the engines floor; 24: what Render runs
        node: [22, 24]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The parity and geometry tests import the frontend's own map builders
      # and weapon tables (three.js included) to check the server against
      # them, so the frontend's dependencies must be installed too.
      - name: Install frontend (for the parity tests)
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Install
        run: npm ci
      # typecheck, lint, unit/integration tests and the production build
      - name: Check
        run: npm run check

  e2e:
    name: Browser smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install frontend
        run: bun install --frozen-lockfile
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/.results
          # the folder starts with a dot, and upload-artifact v4 skips hidden
          # files unless told otherwise: without this nothing was ever uploaded
          include-hidden-files: true
          retention-days: 7
